<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SapaRate — качество диалогов</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%232b7de9%27 stroke-width=%274%27/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <header class="nav">
      <div class="brand"><b>SapaRate</b></div>
      <nav class="nav-links">
        <a href="#/dialogs" data-route="dialogs">Диалоги</a>
        <a href="#/appeals" data-route="appeals">Апелляции <span class="nav-badge" id="appealBadge" hidden></span></a>
        <a href="#/checklist" data-route="checklist">Чек-лист</a>
        <a href="#/compare" data-route="compare">Сравнение версий</a>
        <a href="#/trainer" data-route="trainer">Тренажёр</a>
      </nav>
      <div class="nav-right">
        <button class="nav-foot" id="providerInfo" type="button" aria-haspopup="true" aria-expanded="false">модель</button>
        <button class="themebtn" id="themeToggle" type="button" title="Переключить тему">☾ Тёмная</button>
      </div>
      <div class="pop" id="modelPop" hidden></div>
    </header>
    <main class="view" id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
